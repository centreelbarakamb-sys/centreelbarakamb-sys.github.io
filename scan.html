<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الحضور · Pointage</title>
<link rel="stylesheet" href="style.css">
<style>
  #reader { width: 100%; border-radius: var(--radius); overflow: hidden; background: #000; min-height: 240px; }
  #reader video { object-fit: cover; }
  .result { border-radius: var(--radius); padding: 18px; text-align: center; margin-bottom: 14px; transition: transform .15s; }
  .result.pop { transform: scale(1.03); }
  .result .big { font-size: 1.6rem; font-weight: 800; line-height: 1.3; }
  .result .sub { font-weight: 600; margin-top: 4px; }
  .result.ok { background: var(--ok-bg); color: var(--ok); }
  .result.warn { background: var(--warn-bg); color: var(--warn); }
  .result.bad { background: var(--bad-bg); color: var(--bad); }
  .result.idle { background: var(--muted-bg); color: var(--soft); }
  .count { font-weight: 800; color: var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span id="center">سنتر البركة</span><small>تسجيل الحضور · Pointage</small></div>
    <button class="ghost small hidden" id="logout">خروج</button>
  </header>

  <div class="card" id="pinBox">
    <h2>رقم الاستقبال <span class="fr">Code accueil</span></h2>
    <p class="soft">بيتكتب مرة واحدة على الموبايل ده.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
    <div style="height:10px"></div>
    <button id="pinBtn">دخول · Entrer</button>
    <p class="msg bad hidden" id="pinErr"></p>
  </div>

  <div id="app" class="hidden">
    <div class="result idle" id="result"><div class="big">جاهز للمسح</div><div class="sub">Prêt à scanner</div></div>

    <div class="card" style="padding:10px">
      <div id="reader"></div>
      <div style="height:10px"></div>
      <div class="row">
        <button class="ghost" id="camBtn">⏸ إيقاف الكاميرا</button>
        <button class="ghost" id="flipBtn">🔄 تبديل</button>
      </div>
    </div>

    <div class="card">
      <label class="lbl" for="manual" style="margin-top:0">إدخال الكود يدويًا <span class="fr">Saisie manuelle / lecteur USB</span></label>
      <form id="manualForm" class="row">
        <input id="manual" autocomplete="off" placeholder="48213" style="direction:ltr">
        <button type="submit" style="flex:0 0 auto;width:auto">تسجيل</button>
      </form>
    </div>

    <div class="card">
      <h2>حضروا النهارده <span class="fr">Présents aujourd'hui</span> · <span class="count" id="count">0</span></h2>
      <ul class="list" id="recent"><li class="soft">لسه محدش وصل</li></ul>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const B = window.BARAKA;
  const $ = function (id) { return document.getElementById(id); };
  let pin = B.store.get('staff_pin');
  let scanner = null, camOn = false, facing = 'environment';
  let busy = false, lastCode = '', lastAt = 0, audio = null;
  const today = [];

  function beep(good) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = good ? 880 : 220; o.type = good ? 'sine' : 'square'; g.gain.value = 0.15;
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + (good ? 0.12 : 0.35));
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate(good ? 80 : [120, 60, 120]); } catch (e) {}
  }

  function show(cls, big, sub) {
    const r = $('result');
    r.className = 'result ' + cls + ' pop';
    r.innerHTML = '<div class="big">' + big + '</div><div class="sub">' + sub + '</div>';
    setTimeout(function () { r.classList.remove('pop'); }, 160);
  }

  function renderToday() {
    $('count').textContent = today.length;
    $('recent').innerHTML = today.length ? today.map(function (x) {
      return '<li><div class="who"><b>' + B.esc(x.name) + '</b><span>' + B.esc(x.id) + '</span></div><span class="pill ok">✅ ' + B.esc(x.time) + '</span></li>';
    }).join('') : '<li class="soft">لسه محدش وصل · Personne encore</li>';
  }

  async function login(p) {
    $('pinErr').classList.add('hidden');
    try {
      const r = await B.api('today', { pin: p });
      if (!r.ok) { $('pinErr').textContent = 'الرقم غلط · Code incorrect'; $('pinErr').classList.remove('hidden'); return; }
      pin = p; B.store.set('staff_pin', p);
      $('center').textContent = r.center || 'سنتر البركة';
      $('pinBox').classList.add('hidden'); $('app').classList.remove('hidden'); $('logout').classList.remove('hidden');
      today.length = 0; Array.prototype.push.apply(today, r.list); renderToday();
      startCam();
    } catch (e) {
      $('pinErr').textContent = B.errorText(e); $('pinErr').classList.remove('hidden');
    }
  }

  async function record(code) {
    code = String(code || '').trim().toUpperCase();
    if (!code || busy) return;
    const now = Date.now();
    if (code === lastCode && now - lastAt < 4000) return;   // same card still in front of the camera
    lastCode = code; lastAt = now; busy = true;
    show('idle', '…', B.esc(code));
    try {
      const r = await B.api('scan', { pin: pin, id: code });
      if (r.ok && r.already) {
        show('warn', '↺ ' + B.esc(r.name), 'متسجل النهارده الساعة ' + B.esc(r.time) + ' · Déjà pointé'); beep(true);
      } else if (r.ok) {
        show('ok', '✅ ' + B.esc(r.name), 'وصل الساعة ' + B.esc(r.time) + ' · Arrivé'); beep(true);
        today.unshift({ id: code, name: r.name, time: r.time }); renderToday();
      } else if (r.error === 'pin') {
        B.store.del('staff_pin'); location.reload();
      } else if (r.error === 'unknown') {
        show('bad', '⚠️ كود مش موجود', B.esc(r.id) + ' · Code inconnu'); beep(false);
      } else if (r.error === 'inactive') {
        show('bad', '⚠️ ' + B.esc(r.name), 'الطالب موقوف في الشيت · Élève inactif'); beep(false);
      } else {
        show('bad', '⚠️ خطأ', B.esc(r.message || r.error)); beep(false);
      }
    } catch (e) {
      show('bad', '📶 مفيش نت', 'لم يُسجَّل — امسح تاني · Non enregistré'); beep(false);
      lastCode = '';
    } finally { busy = false; }
  }

  let starting = false;
  function isScanning() {
    try { return !!scanner && scanner.getState() === Html5QrcodeScannerState.SCANNING; } catch (e) { return false; }
  }
  function camError(e) {
    const n = String((e && (e.name || e)) || '');
    if (/NotAllowed|Permission/i.test(n)) return 'اسمح للموقع باستخدام الكاميرا من إعدادات المتصفح';
    if (/NotReadable|TrackStart|in use/i.test(n)) return 'الكاميرا مفتوحة في برنامج تاني — اقفله وجرّب تاني';
    if (/NotFound|Overconstrained|DevicesNotFound/i.test(n)) return 'مفيش كاميرا متاحة — جرّب زرار تبديل';
    if (/secure|https|NotSupported/i.test(n)) return 'افتح الصفحة في Chrome أو Safari (مش من جوه واتساب أو فيسبوك)';
    return 'جرّب تقفل الصفحة وتفتحها تاني، أو اكتب الكود يدوي';
  }

  async function startCam() {
    if (starting || isScanning()) { camOn = true; $('camBtn').textContent = '⏸ إيقاف الكاميرا'; return; }
    starting = true;
    try {
      if (!scanner) scanner = new Html5Qrcode('reader', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE], verbose: false });
      await scanner.start({ facingMode: facing },
        { fps: 10, qrbox: function (w, h) { const m = Math.min(w, h); const s = Math.max(Math.min(m, 160), Math.floor(m * 0.7)); return { width: s, height: s }; } },
        function (text) { record(text); }, function () {});
      camOn = true; $('camBtn').textContent = '⏸ إيقاف الكاميرا';
    } catch (e) {
      if (isScanning()) {            // camera is actually running — the error was harmless
        camOn = true; $('camBtn').textContent = '⏸ إيقاف الكاميرا';
      } else {
        camOn = false; $('camBtn').textContent = '▶️ تشغيل الكاميرا';
        show('bad', '📷 الكاميرا مش شغالة', camError(e));
      }
    } finally {
      starting = false;
    }
  }
  async function stopCam() {
    try { if (isScanning()) await scanner.stop(); } catch (e) {}
    camOn = false; $('camBtn').textContent = '▶️ تشغيل الكاميرا';
  }

  $('camBtn').onclick = function () { camOn ? stopCam() : startCam(); };
  $('flipBtn').onclick = async function () { facing = facing === 'environment' ? 'user' : 'environment'; await stopCam(); startCam(); };
  $('manualForm').onsubmit = function (e) { e.preventDefault(); lastCode = ''; record($('manual').value); $('manual').value = ''; };
  $('pinBtn').onclick = function () { login($('pin').value.trim()); };
  $('pin').onkeydown = function (e) { if (e.key === 'Enter') login($('pin').value.trim()); };
  $('logout').onclick = function () { B.store.del('staff_pin'); location.reload(); };
  if (pin) login(pin);
})();
</script>
</body>
</html>
